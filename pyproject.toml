[project]
name = "ai-platform"
version = "0.1.0"
description = "Organizational Intelligent AI Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "httpx>=0.27",
    "logfire>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
doc = [
    "pymupdf>=1.24",
]
